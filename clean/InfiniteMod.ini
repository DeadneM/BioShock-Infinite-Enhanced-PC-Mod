[General]
Enabled=1

[Overlay]
; Insert opens/closes. F1 toggles automatic logo skipping for the next launch.
Enabled=1

[Intros]
; Only the four logo StartupMovies entries are commented in XEngine.ini.
; LoopingMovieUntilStartupFinishes and all other settings are preserved.
SkipIntroLogos=1

[Weapons]
Enabled=1

[Progression]
; Explicit menu commands only. No automatic grants on launch.
Enabled=1

[Display]
; Native UI ceiling (HUD and menus), applied at next launch.
; 1.00 = compact native size; choices 1.00, 1.25, 1.50, 2.00.
; XUI.ini MaxResolutionUpScale = HUDScale minus 1 (compact = 0.0).
HUDScale=1.00
; Field of view in degrees: 80 to 130. -/+ adjust it in the overlay.
FOV=80
; F8 in the overlay toggles the weapon/power crosshairs during play.
HideCrosshair=0

[Player]
; F12 cycles 1.00, 1.25, 1.50, 1.75 and 2.00 in the overlay.
SpeedMultiplier=1.00

[Controls]
HoldAim=0
; Windows virtual key: 4=middle mouse, 2=right mouse, 90=Z, 5/6=side buttons.
; Must match the aim key selected in the game's own control settings.
AimKey=4
