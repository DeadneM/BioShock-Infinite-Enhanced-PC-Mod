[General]
Enabled=1

[Overlay]
; Insert opens/closes. Ctrl+F8 opens the keybind editor, including the menu key.
; Action shortcuts also run with the mod menu closed when GlobalHotkeys=1.
Enabled=1

[Intros]
; Only the four logo StartupMovies entries are commented in XEngine.ini.
; LoopingMovieUntilStartupFinishes and all other settings are preserved.
; F12 toggles automatic logo skipping for the next launch.
SkipIntroLogos=1

[Weapons]
; F2 fills both weapons. F3/F4 select a weapon; F5/F6 give it to either slot.
Enabled=1

[Progression]
; Explicit menu commands only. No automatic grants on launch.
; Ctrl+F1 powers, Ctrl+F2 gear, Ctrl+F3 weapon upgrades, Ctrl+F4 vigor upgrades.
; Ctrl+F5 infusions, Ctrl+F6 money, Ctrl+F7 lockpicks: native maxima.
Enabled=1

[Display]
; Native UI ceiling (HUD and menus), applied at next launch.
; 1.00 = compact native size; choices 1.00, 1.25, 1.50, 2.00.
; XUI.ini MaxResolutionUpScale = HUDScale minus 1 (compact = 0.0).
HUDScale=1.00
; Live world FOV, 80..130, changed by -/+ with no restart or special launcher.
FOV=80
; Legacy 0.27 slider preference retained for compatibility; ignored by 0.28.
NativeFOVSlider=-1
; Ctrl+F9 toggles proportional ADS zoom. Existing choices are preserved.
NativeAimZoom=1
; F8 in the overlay toggles the weapon/power crosshairs during play.
HideCrosshair=0

[Player]
; F7 cycles 1.00, 1.25, 1.50, 1.75 and 2.00 in the overlay.
; F1 fills current health, shield and salts without increasing their maxima.
SpeedMultiplier=1.00

[Controls]
; Ctrl+F10 toggles commands without the main menu. Missing key defaults to ON.
GlobalHotkeys=1
HoldAim=0
; F10 applies hold-to-aim to mouse and XInput controller together.
; Ctrl+F11 cycles LT, RT, LB, RB, L3, R3, A, B, X, Y. Match native controls.
ControllerAimButton=LT
ControllerAimThreshold=30
; Windows virtual key: 4=middle mouse, 2=right mouse, 90=Z, 5/6=side buttons.
; Must match the aim key selected in the game's own control settings.
AimKey=4

[Keybinds]
; These defaults can all be changed in the Ctrl+F8 menu and persist here.
; Use names such as F1, Insert, Mouse4 or Ctrl+Alt+K. Modifier matching is exact.
; Missing entries use the defaults below; existing custom bindings are preserved.
MainMenu=Insert
BindingsMenu=Ctrl+F8
Vitals=F1
Ammo=F2
WeaponPrevious=F3
WeaponNext=F4
GiveMain=F5
GiveSecondary=F6
Speed=F7
SkipIntros=F12
Powers=Ctrl+F1
Gear=Ctrl+F2
WeaponUpgrades=Ctrl+F3
VigorUpgrades=Ctrl+F4
Infusions=Ctrl+F5
Money=Ctrl+F6
Lockpicks=Ctrl+F7
Crosshair=F8
HUD=F9
HoldAim=F10
AimKey=F11
FovDecrease=Minus
FovIncrease=Plus
NativeAimZoom=Ctrl+F9
GlobalHotkeys=Ctrl+F10
ControllerAimKey=Ctrl+F11
MouseNormal=Ctrl+1
MouseADS=Ctrl+2
MouseSniper=Ctrl+3
PadNormal=Ctrl+4
PadADS=Ctrl+5
PadSniper=Ctrl+6
WeaponBack=Ctrl+0

[Input]
; Multipliers relative to native input; all default 1.00 (unchanged).
; Choices: 0.10, 0.25, 0.50, 0.75, 1.00, 1.25, 1.50, 2.00.
MouseNormal=1.00
MouseADS=1.00
MouseSniper=1.00
ControllerNormal=1.00
ControllerADS=1.00
ControllerSniper=1.00

[FirstPerson]
; Experimental native root position. 0=original; 2,4,6,8,10 units toward camera.
; Disabled while aiming; no world FOV or projection change.
BackOffset=0
